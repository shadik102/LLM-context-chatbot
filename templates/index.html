
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Context Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2>Gemini Chat</h2>
            <button id="newChatBtn">+ New Chat</button>
            <p class="sidebar-note">Your conversations stay separate.</p>
            <div class="sidebar-footer">Powered by Gemini API</div>
        </aside>

        <main class="chat-area">
            <header>
                <h1>LLM Context Chatbot</h1>
                <p>Ask questions and continue your conversation.</p>
            </header>

            <section id="messages" class="messages">
                <div class="welcome">
                    <h2>Hello! 👋</h2>
                    <p>How can I help you today?</p>
                </div>
            </section>

            <form id="chatForm" class="input-area">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                    required
                >
                <button type="submit" id="sendBtn">Send</button>
            </form>

            <p class="footer-note">AI responses may occasionally be inaccurate.</p>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
